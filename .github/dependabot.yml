version: 2
updates:
  # npm for both tldraw packages in ONE entry so the `tldraw` group can bump
  # frontend (@tldraw/tldraw, @tldraw/sync) and backend (@tldraw/sync-core)
  # in the same PR — the two sides must run the exact same tldraw version
  # (see tldraw-parity.yml). Everything else (ws, unfurl.js, react, vite...)
  # still gets its own PRs.
  - package-ecosystem: "npm"
    directories:
      - "/tldraw"
      - "/tldraw-sync-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      tldraw:
        patterns:
          - "tldraw"
          - "@tldraw/*"
    reviewers:
      - "vppillai"
    assignees:
      - "vppillai"
    commit-message:
      prefix: "npm"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "vppillai"
    assignees:
      - "vppillai"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker base-image updates for the per-service Dockerfiles.
  # (A duplicate "Docker Compose" entry pointing at the same directory
  # was here previously — dependabot dedupes silently, so the second
  # block was dead config that confused readers.)
  - package-ecosystem: "docker"
    directories:
      - "/tldraw"
      - "/tldraw-sync-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "vppillai"
    assignees:
      - "vppillai"
    # Node major bumps (e.g. 22 -> 26) are deliberate upgrades, not
    # weekly noise; minor/patch base-image updates still come through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
      include: "scope"
